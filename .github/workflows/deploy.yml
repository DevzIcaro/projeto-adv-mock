name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Isso permite que você clique em um botão para rodar manualmente

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          path: .
          package-manager: pnpm@8
